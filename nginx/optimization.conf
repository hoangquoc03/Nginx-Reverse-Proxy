# Reference snippets only. This file is not loaded by Nginx and is not a complete
# standalone Nginx configuration. Merge each section into the existing config context.

# Add these directives inside the existing http { ... } block in /etc/nginx/nginx.conf.
# Check nginx -T first and avoid duplicate gzip directives.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    text/xml
    image/svg+xml;

