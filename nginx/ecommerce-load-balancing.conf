# Workspace example only. Not installed on the VPS and not verified against live services.
# This file contains upstream/server blocks and must be included from within http {}.
# Check for existing upstream names and duplicate server_name values before enabling.

upstream ecommerce_backend {
    # Share passive-failure state among Nginx workers.
    zone ecommerce_backend 64k;

    # Round Robin is the default when no balancing directive/weight is specified.
    server 127.0.0.1:8080 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:8081 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:8082 max_fails=2 fail_timeout=10s;
}

# Admin subdomain -> React Admin.
# 127.0.0.1:4000 assumes Nginx runs on the host and the container port is
# published/bound on the host loopback. Use a reachable service name/IP if Nginx
# itself runs in a separate container.
server {
    listen 80;
    server_name admin.my-ecommerce.com;

    location / {
        proxy_pass http://127.0.0.1:4000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Main domain -> API upstream at /api/ and React Frontend at /.
server {
    listen 80;
    server_name my-ecommerce.com;

    # Do not let the bare /api path fall through to the Frontend location.
    location = /api {
        return 404;
    }

    location /api/ {
        # No URI suffix: preserve /api/... when forwarding to the Gateway.
        proxy_pass http://ecommerce_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
